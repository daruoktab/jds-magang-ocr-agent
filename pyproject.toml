[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jds-magang"
version = "0.1.0"
description = "Vision RAG agent: vision embedding (Qwen3-VL via llama.cpp) + VLM agent (qwen3.5 via LM Studio) -> structured JSON"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.5",
    "langchain>=1.3",
    "langchain-core>=1.5",
    "langgraph>=1.2",
    "langchain-openai>=1.4",
    "pydantic>=2",
    "numpy>=2",
    "Pillow>=12",
    "pymupdf>=1.24",
    "requests>=2",
    "fiftyone>=1.20.1",
    "huggingface>=0.0.1",
    "huggingface-hub>=1.27.0",
]

[project.optional-dependencies]
# torch (CPU/GPU) dan transformers dikelola manual, bukan via `uv sync`.
# Install build GPU torch sesuai driver Anda setelahnya.
ml = [
    "torch>=2",
    "transformers>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
