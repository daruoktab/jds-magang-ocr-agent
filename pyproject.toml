[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jds-magang-ocr-agent"
version = "0.1.0"
description = "Vision OCR & Document Text Extractor (Ready for Chunking): PDF, PPTX, Scan -> Markdown"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.5",
    "huggingface_hub>=0.20",
    "langchain>=1.3",
    "langchain-core>=1.5.6",
    "langchain-openai>=1.4",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=1.2",
    "pydantic>=2",
    "numpy>=1.26",
    "Pillow>=10",
    "pymupdf>=1.24",
    "python-pptx>=1.0.2",
    "requests>=2",
    "mcp>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
