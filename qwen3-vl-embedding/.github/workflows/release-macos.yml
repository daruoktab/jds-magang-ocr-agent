name: Release macOS binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    # Apple Silicon (arm64) only - matches LM Studio's own scope, and Intel
    # support is going away upstream on both the OS side (macOS 27) and in
    # comparable projects. No Intel build is produced.
    runs-on: macos-14
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_METAL=ON \
            -DLLAMA_OPENSSL=OFF \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH='@loader_path'

      - name: Build
        run: |
          cmake --build llama.cpp/build \
            --target llama-vl-embedding llama-vl-rerank llama-server llama-quantize \
            -j "$(sysctl -n hw.ncpu)"

      - name: Package (binaries + dylibs, ad-hoc signed)
        id: package
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          DIST_NAME="qwen3-vl-embedding-llama-cpp-macos-arm64-${TAG}"
          DIST_DIR="dist/${DIST_NAME}"

          mkdir -p "${DIST_DIR}"
          cp -RP llama.cpp/build/bin/llama-vl-embedding "${DIST_DIR}/"
          cp -RP llama.cpp/build/bin/llama-vl-rerank "${DIST_DIR}/"
          cp -RP llama.cpp/build/bin/llama-server "${DIST_DIR}/"
          cp -RP llama.cpp/build/bin/llama-quantize "${DIST_DIR}/"
          cp -RP llama.cpp/build/bin/*.dylib "${DIST_DIR}/"

          while IFS= read -r link; do
            target="$(readlink "${link}")"
            if [[ "${target}" = /* || "${target}" = ".." || "${target}" = ../* || "${target}" = */../* ]]; then
              echo "Refusing to package an unsafe symbolic link: ${link} -> ${target}" >&2
              exit 1
            fi
          done < <(find "${DIST_DIR}" -type l -print)

          # Ad-hoc sign every Mach-O file. No paid Developer ID is used;
          # see README for the `xattr -d com.apple.quarantine` note users
          # need after downloading.
          find "${DIST_DIR}" -type f \( -perm -u+x -o -name "*.dylib" \) -print0 \
            | xargs -0 -I{} codesign --force -s - --timestamp=none {}

          tar -C dist -czf "dist/${DIST_NAME}.tar.gz" "${DIST_NAME}"
          rm -rf "${DIST_DIR}"

          cd dist
          shasum -a 256 "${DIST_NAME}.tar.gz" > SHA256SUMS.txt
          cd ..

          echo "dist_name=${DIST_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" \
            "dist/${{ steps.package.outputs.dist_name }}.tar.gz" \
            "dist/SHA256SUMS.txt" \
            --title "${{ steps.package.outputs.tag }}" \
            --generate-notes
